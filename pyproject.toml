[project]
name = "stellarhector"
description = "Stellar Vector's Discord bot"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # type annotations on every function
]

[tool.ruff.lint.isort]
known-first-party = ["archive", "cogs", "core", "ctf", "feeds", "tests", "utils"]

[tool.ruff.lint.per-file-ignores]
# GIT_PYTHON_REFRESH must be set before GitPython is imported
"tests/test_bot.py" = ["E402"]
"tests/test_ctf_archive.py" = ["E402"]
# Fixed moments (utc(...)) as defaults are immutable; tests aren't annotated
"tests/*" = ["B008", "ANN"]

[tool.mypy]
python_version = "3.11"
files = ["bot.py", "main.py", "core", "ctf", "feeds", "archive", "cogs", "utils"]
explicit_package_bases = true
# discord.py, GitPython and aiohttp ship types; the ICS and markdown libraries don't
ignore_missing_imports = true
